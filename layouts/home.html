{{ define "main" }}
<content>
  {{ with .Params.avatar }}
  <img class="avatar" src="{{ . | absURL }}" alt="Avatar" width="120" height="120" />
  {{ end }}
  {{ .Content }}
  <h3>Posts</h3>
  <ul class="blog-posts">
    {{ range where site.RegularPages "Section" "blog" }}
    <li>
      <span>
        <i>
          <time datetime='{{ .Date.Format "2006-01-02" }}'>
            {{ .Date.Format (default "02 Jan, 2006" site.Params.dateFormat) }}
          </time>
        </i>
      </span>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
    </li>
    {{ else }}
    <li>
      No posts yet
    </li>
    {{ end }}
  </ul>
</content>
{{ end }}
