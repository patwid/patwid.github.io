{{- /* post list: title first, date below; expects the pages as context */ -}}
<ul class="blog-posts">
  {{ range . }}
  <li>
    <a href="{{ .Permalink }}">{{ .Title }}</a>
    <span>
      <i>
        <time datetime='{{ .Date.Format "2006-01-02" }}'>
          {{ .Date.Format (default "02 Jan, 2006" site.Params.dateFormat) }}
        </time>
      </i>
    </span>
  </li>
  {{ else }}
  <li>
    No posts yet
  </li>
  {{ end }}
</ul>
