<style>
.highlight pre,
.code pre {
  box-sizing: border-box;
  padding: 1em;
}

/* chroma puts display:flex line spans inside an inline <code>, which adds an
   empty line box before and after the code; a block <code> avoids that */
.highlight pre code,
.code pre code {
  display: block;
}

/* blog index: date on its own line, post link below */
ul.blog-posts li {
  display: block;
}
ul.blog-posts li span {
  display: block;
}
ul.blog-posts li + li {
  margin-top: 1em;
}

/* home page: round, GitHub-like avatar above the text */
img.avatar {
  display: block;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  margin: 1em 0;
}
</style>
