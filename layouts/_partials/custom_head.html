<style>
.highlight pre,
.code pre {
  box-sizing: border-box;
  padding: 1em;
  /* the highlight style sets a light background inline, so keep the text
     dark even when the theme switches to its dark color scheme */
  color: #444;
}

/* dark mode: dark grey page instead of the theme's teal, with link colors
   to match; the theme's visited purple is too dark on grey (4.2:1) */
@media (prefers-color-scheme: dark) {
  :root {
    --background-color: #121212;
    --link-color: #7cb7ff;
    --visited-color: #b9a3e8;
    /* match the headings as in light mode; the theme's #ccc is dimmer than
       the body text, which flips the emphasis */
    --blockquote-color: #eee;
  }
}

/* in dark mode, flip the light code block to dark while keeping its hues */
@media (prefers-color-scheme: dark) {
  .highlight pre,
  .code pre {
    filter: invert(1) hue-rotate(180deg);
    /* the inline #f0f0f0 would invert to near black, darker than the page;
       this light grey inverts to #222, a shade lighter than the page */
    background-color: #ddd !important;
    /* inverts to #ddd, the theme's dark mode body text */
    color: #222;
  }
}

/* chroma puts display:flex line spans inside an inline <code>, which adds an
   empty line box before and after the code; a block <code> avoids that */
.highlight pre code,
.code pre code {
  display: block;
}

/* post lists: post link on its own line, date below */
ul.blog-posts li {
  display: block;
}
ul.blog-posts li span {
  display: block;
}
ul.blog-posts li + li {
  margin-top: 1em;
}

/* home page: no heading over the post list, so set it apart from the
   introduction with some extra space instead */
.intro + ul.blog-posts {
  margin-top: 2.5em;
}

/* home page: round, GitHub-like avatar beside the introduction, its top
   aligned with the first line of text */
.intro {
  display: flex;
  align-items: flex-start;
  gap: 1.5em;
  margin: 1em 0;
}
.intro > div > :first-child {
  margin-top: 0;
}
.intro > div > :last-child {
  margin-bottom: 0;
}
img.avatar {
  flex: none;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
}
/* phones: stack the avatar above the introduction so the text keeps the
   full width */
@media (max-width: 480px) {
  .intro {
    flex-direction: column;
    gap: 1em;
  }
  img.avatar {
    width: 96px;
    height: 96px;
  }
}

/* footer: contact links set smaller than the body text */
footer {
  font-size: 0.85em;
}

/* post images: a markdown image on its own line renders as the only child
   of a <p>; center it and keep it within the content width */
p > img:only-child {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0 auto;
}
</style>
